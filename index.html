<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MASTERLAGA - E-Football H2H & Standings</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {

    <style>
        .scrollbar-hide::-webkit-scrollbar { display: none; }

    </style>

    <!-- ONESIGNAL -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        try {
            await OneSignal.init({
              appId: "f821911e-ae95-4a5c-aed9-12798c4282ab",
              safari_web_id: "",

            });
        } catch(error) {
            // Mencegah error muncul di layar preview Canvas
            console.warn("OneSignal hanya dapat diinisialisasi di domain github Anda:", error);
        }
      });
    </script>
</head>
<body class="pb-12 overflow-x-hidden relative text-slate-800">

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="fixed top-4 left-1/2 transform -translate-x-1/2 z-[60] bg-brand-dark text-white px-6 py-3 rounded-full shadow-2xl items-center gap-3 animate-fade-in-down border border-slate-700 hidden">
        <i class="fas fa-check-circle text-green-400"></i>
        <span id="toast-msg" class="font-semibold text-sm">Berhasil</span>
    </div>

    <!-- CUSTOM CONFIRM/ALERT DIALOG -->
    <div id="custom-dialog" class="fixed inset-0 z-[70] bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden animate-zoom-in border border-slate-200">
            <div class="p-6 text-center">
                <div class="w-16 h-16 rounded-full bg-red-100 text-red-600 flex items-center justify-center mx-auto mb-4" id="dialog-icon-container">
                    <i class="fas fa-exclamation-triangle text-3xl" id="dialog-icon"></i>
                </div>
                <h3 class="text-xl font-black text-slate-800 mb-2" id="dialog-title">Perhatian!</h3>
                <p class="text-slate-500 font-medium text-sm" id="dialog-msg">Apakah Anda yakin?</p>
            </div>
            <div class="flex border-t border-slate-100 bg-slate-50">
                <button id="dialog-btn-cancel" onclick="window.closeCustomDialog(false)" class="flex-1 py-4 text-slate-500 font-bold hover:bg-slate-100 transition-colors border-r border-slate-100">Batal</button>
                <button id="dialog-btn-confirm" onclick="window.closeCustomDialog(true)" class="flex-1 py-4 text-red-600 font-black hover:bg-red-50 transition-colors">Yakin</button>
            </div>
        </div>
    </div>

    <!-- ADMIN LOGIN MODAL -->
    <div id="admin-modal" class="fixed inset-0 z-50 bg-brand-dark/80 backdrop-blur-md flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-sm overflow-hidden animate-zoom-in border-4 border-brand-purple/20">
            <div class="bg-gradient-to-br from-brand-purple to-brand-blue p-8 text-center text-white relative">
                <button onclick="window.closeAdminModal()" class="absolute top-4 right-4 text-white/50 hover:text-white"><i class="fas fa-times text-xl"></i></button>
                <i class="fas fa-user-shield text-5xl mb-3 drop-shadow-lg"></i>
                <h3 class="text-2xl font-black tracking-widest">AKSES ADMIN</h3>
            </div>
            <div class="p-8 bg-slate-50">
                <input type="password" id="admin-password-input" placeholder="Masukkan Sandi..." class="w-full border-2 border-slate-200 rounded-xl px-4 py-3 mb-6 focus:border-brand-purple focus:outline-none transition-colors text-center font-bold tracking-widest text-lg shadow-inner" autofocus>
                <button onclick="window.handleLogin()" class="w-full bg-brand-purple hover:bg-brand-blue text-white font-black py-4 rounded-xl shadow-lg shadow-brand-purple/30 transition-all transform hover:-translate-y-1">MASUK SISTEM</button>
            </div>
        </div>
    </div>

    <!-- MODAL RANGKUMAN HARI INI -->
    <div id="summary-modal" class="fixed inset-0 z-[60] bg-brand-dark/80 backdrop-blur-sm flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden animate-zoom-in border-4 border-brand-accent">
            <div class="bg-gradient-to-r from-brand-dark to-brand-blue p-6 text-center text-white relative">
                <button onclick="window.closeSummaryModal()" class="absolute top-4 right-4 text-white/50 hover:text-white"><i class="fas fa-times text-xl"></i></button>
                <h3 class="text-xl font-black tracking-widest mb-1"><i class="fas fa-newspaper text-brand-accent mr-2"></i> RANGKUMAN HARI INI</h3>
                <p class="text-xs text-blue-200 font-bold" id="summary-date"></p>
            </div>
            <div class="p-6 bg-slate-50 max-h-[60vh] overflow-y-auto custom-scrollbar" id="summary-content"></div>
            <div class="p-4 bg-white border-t border-slate-100 text-center">
                <button onclick="window.closeSummaryModal()" class="w-full py-3 bg-slate-200 hover:bg-slate-300 text-slate-700 font-black rounded-xl transition-colors">TUTUP</button>
            </div>
        </div>
    </div>

    <header class="bg-brand-dark text-white shadow-xl relative z-10 border-b-4 border-brand-accent">
        <!-- Dekorasi Background -->
        <div class="absolute inset-0 overflow-hidden pointer-events-none opacity-20">
            <div class="absolute -right-10 -top-20 w-64 h-64 rounded-full bg-brand-purple blur-3xl"></div>
            <div class="absolute -left-10 top-0 w-48 h-48 rounded-full bg-brand-blue blur-3xl"></div>
        </div>
        
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
            <!-- Indikator Cloud Database -->
            <div id="sync-status" class="absolute top-2 left-4 text-[10px] text-slate-400 font-bold bg-black/40 px-2 py-1 rounded-full backdrop-blur-sm">
                <i class="fas fa-sync fa-spin"></i> Menyambungkan ke Cloud...
            </div>

            <div class="flex justify-between items-center h-24 pt-4">
                <div class="flex items-center gap-4">
                    <div class="w-14 h-14 bg-white rounded-2xl flex items-center justify-center shadow-lg overflow-hidden border border-white/20 p-1">
                        <img src="images/logo.png" alt="Logo" class="w-full h-full object-contain" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                        <i style="display: none;" class="fas fa-gamepad text-brand-blue text-2xl"></i>
                    </div>
                    <div>
                        <h1 class="text-2xl sm:text-3xl font-black tracking-widest bg-clip-text text-transparent bg-gradient-to-r from-white via-slate-200 to-brand-accent uppercase drop-shadow-sm">MASTERLAGA</h1>
                        <p class="text-brand-accent text-[10px] sm:text-xs font-bold tracking-[0.2em] uppercase mt-0.5"><i class="fab fa-playstation mr-1"></i> E-Football Community</p>
                    </div>
                </div>
                
                <div class="flex items-center gap-2 sm:gap-3">
                    <button onclick="window.showSummaryModal()" class="flex items-center gap-2 px-3 py-2 sm:px-4 sm:py-2 rounded-xl text-xs sm:text-sm font-black transition-all shadow-lg bg-brand-blue text-white hover:bg-blue-600">
                        <i class="fas fa-list-alt"></i>
                        <span class="hidden md:inline">HASIL HARI INI</span>
                    </button>
                    <button onclick="window.subscribeOneSignal()" id="btn-subscribe" class="hidden lg:flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-black transition-all shadow-lg bg-brand-accent text-brand-dark hover:bg-yellow-300">
                        <i class="fas fa-bell animate-bounce" id="bell-icon"></i>
                        <span id="subscribe-text">LANGGANAN NOTIF</span>
                    </button>
                    <button onclick="window.toggleAdminPanel()" id="btn-admin-lock" class="w-10 h-10 sm:w-12 sm:h-12 rounded-xl flex items-center justify-center border-2 transition-all bg-white/5 border-white/10 hover:bg-white/10 backdrop-blur-sm" title="Admin CMS">
                        <i class="fas fa-lock text-white/50 text-base sm:text-lg" id="lock-icon"></i>
                    </button>
                </div>
            </div>

            <!-- TABS NAVIGASI -->
            <div class="flex flex-col md:flex-row justify-between items-start md:items-end pb-0 mt-4 gap-4 md:gap-0">
                <div class="flex space-x-2 overflow-x-auto w-full md:w-auto scrollbar-hide pb-2 md:pb-0" id="tab-container"></div>
                <div class="pb-3 hidden sm:block">
                    <div class="flex items-center bg-black/40 rounded-lg px-4 py-2 border border-white/10 cursor-pointer backdrop-blur-md">
                        <i class="fas fa-calendar-alt text-brand-accent mr-2 text-sm"></i>
                        <span class="text-xs text-slate-300 mr-2 uppercase tracking-widest font-bold">MUSIM:</span>
                        <span class="text-white text-sm font-black tracking-wider">2026/2027</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 mt-8">
        <div id="app-content" class="animate-fade-in-up">
            <!-- Loading Indicator -->
            <div class="text-center p-20 text-slate-400">
                <i class="fas fa-spinner fa-spin text-4xl mb-4 text-brand-blue"></i>
                <p class="font-bold">Mengambil data dari Cloud Database...</p>
            </div>
        </div>
    </main>

    <!-- ==========================================
         LOGIKA APLIKASI & FIREBASE INTEGRATION
         ========================================== -->
    <script type="module">
        // 1. IMPORT MODUL FIREBASE 
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 2. STATE DATA AWAL (DEFAULT)
        const generateEmptyWinners = () => {
            let w = [];
            for(let i=1; i<=6; i++) w.push({ id: i, season: `Season ${i}`, name: 'Belum Ada', photo: 'images/default.png' });
            return w;
        };

        const defaultData = {
            adminPassword: "admin004",
            players: [], 
            h2hMatches: [], 
            winners: generateEmptyWinners(),
            aboutInfo: {
                title: "Masterlaga",
                description: "Masterlaga adalah komunitas PES/e-Football Playstation yang berdiri sejak 2020. Mencetak banyak master dan player handal.",
                address: "Desa Karang Bajo, Kec. Bayan, Kab. Lombok Utara, NTB",
                contactName: "Ahmad",
                contactWA: "6285956684081"
            }
        };

        window.appData = defaultData;
        window.activeTab = 'klasemen';
        window.isAdminLoggedIn = false;
        
        // 3. KONFIGURASI FIREBASE
        let firebaseConfig;
        let isCanvasEnv = typeof __firebase_config !== 'undefined';
        
        if (isCanvasEnv) {
            // Ini agar Preview di layar Canvas AI berjalan lancar
            firebaseConfig = JSON.parse(__firebase_config);
        } else {
            // ========================================================
            // !!! PENTING UNTUK GITHUB PAGES !!!
            // GANTI KODE DI BAWAH INI DENGAN CONFIG DARI FIREBASE ANDA
            // ========================================================
            firebaseConfig = {
                apiKey: "AIzaSyDzzWOTIWNumv0rbFkB6Ayl6EmhG_bAN0s",
                authDomain: "masterlaga-bf34b.firebaseapp.com",
                projectId: "masterlaga-bf34b",
                storageBucket: "masterlaga-bf34b.firebasestorage.app",
                messagingSenderId: "20354329836",
                appId: "1:20354329836:web:406113fa7b66466a3ec9c9"
            };
        }

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // 4. KONEKSI & SINKRONISASI DATABASE (REAL-TIME)
        async function connectDatabase() {
            try {
                if (isCanvasEnv && typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Gagal Login Firebase:", error);
                document.getElementById('sync-status').innerHTML = '<i class="fas fa-exclamation-triangle text-yellow-500"></i> Auth Error';
            }

            onAuthStateChanged(auth, (user) => {
                if (user) {
                    // Tentukan lokasi penyimpanan data (Path Document)
                    let docRef;
                    if (isCanvasEnv) {
                        const appId = typeof __app_id !== 'undefined' ? __app_id : 'masterlaga-db';
                        docRef = doc(db, 'artifacts', appId, 'public', 'data', 'masterlaga_db', 'main_state');
                    } else {
                        // Path untuk project Firebase Anda sendiri
                        docRef = doc(db, 'masterlaga_db', 'main_state');
                    }

                    // Dengarkan perubahan data secara langsung (Real-Time Listener)
                    onSnapshot(docRef, (docSnap) => {
                        if (docSnap.exists()) {
                            // Jika ada data di Cloud, pakai data tersebut
                            window.appData = docSnap.data();
                        } else {
                            // Jika database masih kosong, simpan data default
                            setDoc(docRef, window.appData);
                        }
                        
                        document.getElementById('sync-status').innerHTML = '<i class="fas fa-cloud text-emerald-400"></i> Online (Tersinkronisasi)';
                        window.renderApp();
                        
                        // Cek URL pop-up notifikasi (Dijalankan setelah data dimuat)
                        const urlParams = new URLSearchParams(window.location.search);
                        if (urlParams.get('view') === 'hari-ini') {
                            setTimeout(() => { window.showSummaryModal(); }, 500);
                        }

                    }, (error) => {
                        console.error("Gagal sinkron data:", error);
                        document.getElementById('sync-status').innerHTML = '<i class="fas fa-cloud-showers-heavy text-rose-500"></i> Gagal Sinkron';
                    });

                    // Modifikasi fungsi saveData agar menyimpan ke Firebase, bukan lagi ke LocalStorage
                    window.saveData = function() {
                        window.renderApp(); // Update layar instan agar terasa cepat
                        setDoc(docRef, window.appData).then(() => {
                            window.showToast("Tersimpan ke Cloud Database!");
                        }).catch(err => {
                            window.openAlertDialog("Database Error", "Gagal menyimpan ke Cloud. Cek Firestore Security Rules Anda.");
                            console.error(err);
                        });
                    }
                }
            });
        }

        // Jalankan koneksi
        connectDatabase();


        // ==========================================
        // SEMUA FUNGSI UI DIBAWAH 
        // Diikat ke objek 'window' agar bisa dipanggil dari HTML
        // ==========================================

        window.customDialogCallback = null;
        window.openConfirmDialog = function(title, message, callback) {
            document.getElementById('dialog-title').innerText = title;
            document.getElementById('dialog-msg').innerText = message;
            document.getElementById('dialog-icon').className = 'fas fa-exclamation-triangle text-3xl';
            document.getElementById('dialog-icon-container').className = 'w-16 h-16 rounded-full bg-red-100 text-red-600 flex items-center justify-center mx-auto mb-4';
            document.getElementById('dialog-btn-confirm').innerText = 'Yakin Hapus';
            document.getElementById('dialog-btn-confirm').className = 'flex-1 py-4 text-red-600 font-black hover:bg-red-50 transition-colors';
            document.getElementById('dialog-btn-cancel').style.display = 'block';
            window.customDialogCallback = callback;
            document.getElementById('custom-dialog').classList.remove('hidden');
        }

        window.openAlertDialog = function(title, message) {
            document.getElementById('dialog-title').innerText = title;
            document.getElementById('dialog-msg').innerText = message;
            document.getElementById('dialog-icon').className = 'fas fa-info-circle text-3xl';
            document.getElementById('dialog-icon-container').className = 'w-16 h-16 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center mx-auto mb-4';
            document.getElementById('dialog-btn-confirm').innerText = 'Tutup';
            document.getElementById('dialog-btn-confirm').className = 'flex-1 py-4 text-blue-600 font-black hover:bg-blue-50 transition-colors w-full';
            document.getElementById('dialog-btn-cancel').style.display = 'none';
            window.customDialogCallback = null;
            document.getElementById('custom-dialog').classList.remove('hidden');
        }

        window.closeCustomDialog = function(isConfirmed) {
            document.getElementById('custom-dialog').classList.add('hidden');
            if(isConfirmed && window.customDialogCallback) window.customDialogCallback();
        }

        let toastTimeout;
        window.showToast = function(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('hidden');
            toast.style.display = 'flex';
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        window.subscribeOneSignal = function() {
            window.showToast("Membuka izin notifikasi browser...");
            if(window.OneSignalDeferred) {
                OneSignalDeferred.push(function(OneSignal) { OneSignal.Slidedown.promptPush(); });
            }
            const btn = document.getElementById('btn-subscribe');
            btn.className = "hidden lg:flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-black transition-all shadow-md bg-green-500/20 text-green-400 border border-green-500/30 cursor-default";
            document.getElementById('bell-icon').classList.remove('animate-bounce');
            document.getElementById('subscribe-text').innerText = "NOTIF AKTIF";
        }

        window.toggleAdminPanel = function() {
            if (window.isAdminLoggedIn) { window.activeTab = 'admin'; window.renderApp(); } 
            else document.getElementById('admin-modal').classList.remove('hidden');
        }
        
        window.closeAdminModal = function() { document.getElementById('admin-modal').classList.add('hidden'); }
        
        window.handleLogin = function() {
            const input = document.getElementById('admin-password-input').value;
            if (input === window.appData.adminPassword) {
                window.isAdminLoggedIn = true;
                window.closeAdminModal();
                window.activeTab = 'admin';
                document.getElementById('admin-password-input').value = '';
                
                const lockBtn = document.getElementById('btn-admin-lock');
                lockBtn.className = "w-10 h-10 sm:w-12 sm:h-12 rounded-xl flex items-center justify-center border-2 transition-all bg-brand-purple border-purple-400 shadow-lg shadow-purple-500/50";
                document.getElementById('lock-icon').className = "fas fa-unlock text-white";
                
                window.showToast("Login Admin Berhasil");
                window.renderApp();
            } else {
                window.openAlertDialog("Gagal Masuk", "Password yang Anda masukkan salah!");
            }
        }
        
        window.handleLogout = function() {
            window.isAdminLoggedIn = false;
            window.activeTab = 'klasemen';
            const lockBtn = document.getElementById('btn-admin-lock');
            lockBtn.className = "w-10 h-10 sm:w-12 sm:h-12 rounded-xl flex items-center justify-center border-2 transition-all bg-white/5 border-white/10 hover:bg-white/10 backdrop-blur-sm";
            document.getElementById('lock-icon').className = "fas fa-lock text-white/50 text-base sm:text-lg";
            window.showToast("Logout Berhasil");
            window.renderApp();
        }

        window.switchTab = function(tabId) { window.activeTab = tabId; window.renderApp(); }

        window.getCalculatedStandings = function() {
            let stats = {};
            window.appData.players.forEach(p => { stats[p.id] = { ...p, mp: 0, w: 0, d: 0, l: 0, pts: 0 }; });

            window.appData.h2hMatches.forEach(m => {
                if(!stats[m.p1Id] || !stats[m.p2Id]) return;
                stats[m.p1Id].mp++; stats[m.p2Id].mp++;
                if (m.winner === 'p1') { stats[m.p1Id].w++; stats[m.p1Id].pts += 1; stats[m.p2Id].l++; } 
                else if (m.winner === 'p2') { stats[m.p2Id].w++; stats[m.p2Id].pts += 1; stats[m.p1Id].l++; } 
                else if (m.winner === 'draw') { stats[m.p1Id].d++; stats[m.p2Id].d++; }
            });
            return Object.values(stats).sort((a, b) => b.pts - a.pts || b.w - a.w || a.mp - b.mp);
        }

        window.renderKlasemen = function() {
            if (window.appData.players.length === 0) {
                return `
                <div class="bg-white rounded-3xl shadow-xl p-16 text-center border border-slate-100 flex flex-col items-center">
                    <div class="w-24 h-24 bg-slate-50 rounded-full flex items-center justify-center mb-6"><i class="far fa-folder-open text-5xl text-slate-300"></i></div>
                    <h3 class="text-2xl font-black text-slate-700 mb-2">Klasemen Kosong</h3>
                    <p class="text-slate-500 font-medium max-w-md">Admin perlu mendaftarkan nama player terlebih dahulu.</p>
                </div>`;
            }

            const sortedPlayers = window.getCalculatedStandings();
            let rows = '';
            
            sortedPlayers.forEach((p, index) => {
                rows += `
                <tr class="border-b border-slate-100 hover:bg-slate-50 transition-colors ${index === 0 ? 'bg-gradient-to-r from-yellow-50 to-transparent' : ''}">
                    <td class="px-5 py-4 text-center font-black ${index === 0 ? 'text-yellow-600 text-xl' : 'text-slate-400'}">${index === 0 ? '<i class="fas fa-crown"></i>' : index + 1}</td>
                    <td class="px-5 py-4 font-bold text-slate-800 flex items-center gap-4">
                        <div class="w-12 h-12 rounded-full bg-slate-200 flex items-center justify-center overflow-hidden border-2 border-white shadow-md shrink-0">
                            <img src="${p.photo}" alt="${p.name}" class="w-full h-full object-cover" onerror="this.src='https://ui-avatars.com/api/?name=${p.name}&background=0f172a&color=fff'">
                        </div>
                        <span class="truncate max-w-[120px] sm:max-w-xs">${p.name}</span>
                    </td>
                    <td class="px-5 py-4 text-center text-slate-600 font-semibold">${p.mp}</td>
                    <td class="px-5 py-4 text-center text-emerald-600 font-black">${p.w}</td>
                    <td class="px-5 py-4 text-center text-slate-400 font-semibold">${p.d}</td>
                    <td class="px-5 py-4 text-center text-rose-500 font-semibold">${p.l}</td>
                    <td class="px-5 py-4 text-center font-black text-brand-blue text-xl bg-blue-50/50">${p.pts}</td>
                </tr>`;
            });

            return `
            <div class="bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-100">
                <div class="bg-slate-50 border-b border-slate-100 px-6 py-4 flex justify-between items-center">
                    <h2 class="font-black text-slate-800 tracking-wide flex items-center gap-2"><i class="fas fa-list-ol text-brand-blue"></i> LEADERBOARD KEMENANGAN</h2>
                </div>
                <div class="overflow-x-auto">

        window.calculateH2H = function() {
            const p1Id = parseInt(document.getElementById('h2h-p1').value);
            const p2Id = parseInt(document.getElementById('h2h-p2').value);

            if (p1Id === p2Id) { window.openAlertDialog("Pilihan Tidak Valid", "Pilih dua player berbeda."); return; }

            const matches = window.appData.h2hMatches.filter(m => 
                (m.p1Id === p1Id && m.p2Id === p2Id) || (m.p1Id === p2Id && m.p2Id === p1Id)
            );

            let p1Wins = 0, p2Wins = 0, draws = 0;
            let p1Shames = 0, p2Shames = 0;

            matches.forEach(m => {
                if (m.p1Id === p1Id) {
                    if(m.winner === 'p1') { p1Wins++; if(m.shame) p1Shames++; }
                    else if(m.winner === 'p2') { p2Wins++; if(m.shame) p2Shames++; }
                    else draws++;
                } else {
                    if(m.winner === 'p1') { p2Wins++; if(m.shame) p2Shames++; }
                    else if(m.winner === 'p2') { p1Wins++; if(m.shame) p1Shames++; }
                    else draws++;
                }
            });

            const totalMatches = matches.length;
            let p1ShameText = p1Shames > 0 ? `<div class="text-[10px] text-purple-600 font-bold mt-1"><i class="fas fa-skull"></i> ${p1Shames}x Mempermalukan Lawan</div>` : '';
            let p2ShameText = p2Shames > 0 ? `<div class="text-[10px] text-purple-600 font-bold mt-1"><i class="fas fa-skull"></i> ${p2Shames}x Mempermalukan Lawan</div>` : '';

            let html = `
            <div class="bg-white rounded-2xl border border-slate-200 p-6 sm:p-8 shadow-sm">
                <h3 class="text-center font-black text-slate-800 text-xl mb-8 uppercase tracking-widest border-b border-slate-100 pb-4">Telah Bertemu: <span class="text-brand-blue">${totalMatches}</span> Kali</h3>
                <div class="flex justify-between text-xs font-black mb-2 px-1">
                    <span class="text-brand-blue">${p1Wins} MENANG</span><span class="text-slate-400">${draws} SERI</span><span class="text-rose-500">${p2Wins} MENANG</span>
                </div>
                <div class="w-full h-6 bg-slate-200 rounded-full overflow-hidden flex mb-8 shadow-inner">
                    <div class="bg-brand-blue h-full" style="width: ${totalMatches===0?0: (p1Wins/totalMatches)*100}%"></div>
                    <div class="bg-slate-400 h-full" style="width: ${totalMatches===0?0: (draws/totalMatches)*100}%"></div>
                    <div class="bg-rose-500 h-full" style="width: ${totalMatches===0?0: (p2Wins/totalMatches)*100}%"></div>
                </div>
                <div class="flex justify-between items-center text-sm font-bold bg-slate-50 p-4 rounded-xl border border-slate-100">
                    <div class="w-1/3 text-left">
                        <div class="text-brand-blue text-3xl font-black">${p1Wins}</div>
                        ${p1ShameText}
                    </div>
                    <div class="w-1/3 text-center text-slate-400 uppercase tracking-widest text-[10px]">Dominasi (Win Rate)</div>
                    <div class="w-1/3 text-right">
                        <div class="text-rose-500 text-3xl font-black">${p2Wins}</div>
                        ${p2ShameText}
                    </div>
                </div>
            </div>`;

            const resDiv = document.getElementById('h2h-result');
            resDiv.innerHTML = html;
            resDiv.classList.remove('hidden');
        }

                    <div class="absolute -top-6 -right-6 text-slate-50 group-hover:text-yellow-50 transition-colors">

        window.uploadImage = function(event, type, index) {
            const file = event.target.files[0];
            if (!file) return;
            
            // Batasi ukuran maksimal 300KB
            if (file.size > 300 * 1024) { 
                window.openAlertDialog("File Terlalu Besar", "Ukuran foto maksimal 300KB agar aplikasi tetap cepat. Silakan kompres atau crop foto Anda.");
                event.target.value = '';
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Str = e.target.result;
                if (type === 'player') {
                    window.appData.players[index].photo = base64Str;
                } else if (type === 'winner') {
                    window.appData.winners[index].photo = base64Str;
                }
                window.saveData();
                window.showToast("Foto berhasil diupload!");
            };
            reader.readAsDataURL(file);
        }

        window.deletePlayer = function(index) {
            window.openConfirmDialog("Hapus Pemain?", "Data pemain ini akan hilang di cloud.", () => {
                window.appData.players.splice(index, 1); window.saveData();
            });
        }
        
        window.addH2HMatch = function() {
            const p1 = document.getElementById('new-h2h-p1').value;
            const p2 = document.getElementById('new-h2h-p2').value;
            const res = document.getElementById('new-h2h-result').value;
            const shame = document.getElementById('new-h2h-shame').checked;

            if(!p1 || !p2) { window.openAlertDialog("Data Tidak Lengkap", "Harap pilih kedua player."); return; }
            if(p1 === p2) { window.openAlertDialog("Tidak Valid", "Player 1 dan Player 2 tidak boleh sama."); return; }

            window.appData.h2hMatches.push({ id: Date.now(), p1Id: parseInt(p1), p2Id: parseInt(p2), winner: res, dateStr: new Date().toISOString(), shame: shame });
            window.saveData(); 
        }
        window.deleteH2HMatch = function(index) {
            window.openConfirmDialog("Batalkan Riwayat Tanding?", "Laga ini akan dihapus permanen.", () => {
                window.appData.h2hMatches.splice(index, 1); window.saveData();
            });
        }
        window.updateWinner = function(index, field, value) { window.appData.winners[index][field] = value; window.saveData(); }

        window.showSummaryModal = function() {
            const today = new Date().toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            document.getElementById('summary-date').innerText = today;

            const todayStr = new Date().toLocaleDateString();
            const todaysMatches = window.appData.h2hMatches.filter(m => new Date(m.dateStr).toLocaleDateString() === todayStr);

            let html = '';
            if (todaysMatches.length === 0) {
                html = `<div class="text-center p-8"><i class="fas fa-box-open text-5xl text-slate-300 mb-4"></i><p class="font-bold text-slate-500">Belum ada pertandingan hari ini.</p></div>`;
            } else {
                html = `<div class="space-y-3">`;
                todaysMatches.slice().reverse().forEach(m => {
                    const p1 = window.appData.players.find(p => p.id === m.p1Id)?.name || 'Unknown';
                    const p2 = window.appData.players.find(p => p.id === m.p2Id)?.name || 'Unknown';
                    
                    let resultBadge = '';
                    let p1Style = 'text-slate-600', p2Style = 'text-slate-600';

                    if(m.winner === 'p1') { resultBadge = `<span class="bg-brand-blue text-white px-2 py-1 rounded text-[10px] font-black shadow">WIN</span>`; p1Style = 'text-brand-blue font-black text-sm sm:text-lg'; } 
                    else if(m.winner === 'p2') { resultBadge = `<span class="bg-brand-blue text-white px-2 py-1 rounded text-[10px] font-black shadow">WIN</span>`; p2Style = 'text-brand-blue font-black text-sm sm:text-lg'; } 
                    else { resultBadge = `<span class="bg-slate-300 text-slate-700 px-2 py-1 rounded text-[10px] font-black">SERI</span>`; }

                    let shameBadge = m.shame ? `<div class="w-full text-center mt-1"><span class="bg-purple-600 text-white px-2 py-0.5 rounded text-[8px] font-black tracking-widest inline-flex items-center gap-1 shadow-sm"><i class="fas fa-skull"></i> KALAH TIDAK TERHORMAT</span></div>` : '';

                    html += `
                    <div class="bg-white border ${m.shame ? 'border-purple-300 bg-purple-50' : 'border-slate-200'} rounded-xl p-4 flex flex-col shadow-sm">
                        <div class="flex items-center justify-between w-full">
                            <div class="flex-1 text-right font-bold truncate ${p1Style} pr-3">${p1}</div>
                            <div class="shrink-0 text-center w-16">${resultBadge}</div>
                            <div class="flex-1 text-left font-bold truncate ${p2Style} pl-3">${p2}</div>
                        </div>
                        ${shameBadge}
                    </div>`;
                });
                html += `</div>`;
            }

            document.getElementById('summary-content').innerHTML = html;
            document.getElementById('summary-modal').classList.remove('hidden');
        }

        window.closeSummaryModal = function() { document.getElementById('summary-modal').classList.add('hidden'); }

        window.renderTabs = function() {
            const tabs = [
                { id: 'klasemen', label: 'Klasemen', icon: 'fa-list-ol' },
                { id: 'h2h', label: 'H2H Stats', icon: 'fa-bolt' },
                { id: 'winners', label: 'The Winner', icon: 'fa-trophy' },
                { id: 'about', label: 'About', icon: 'fa-info-circle' },
            ];

            let html = '';
            tabs.forEach(tab => {
                const isActive = window.activeTab === tab.id;
                html += `
                    <button onclick="window.switchTab('${tab.id}')" 
                        class="flex items-center gap-2 px-4 py-4 sm:px-5 text-xs font-black border-b-4 transition-all whitespace-nowrap tracking-wider
                        ${isActive ? 'border-brand-accent text-brand-accent bg-white/5' : 'border-transparent text-white/60 hover:text-white hover:bg-white/5'}">
                        <i class="fas ${tab.icon}"></i> <span class="hidden sm:inline">${tab.label}</span>
                    </button>
                `;
            });

            if (window.isAdminLoggedIn) {
                const isAdminActive = window.activeTab === 'admin';
                html += `
                    <button onclick="window.switchTab('admin')" 
                        class="flex items-center gap-2 px-5 py-4 text-xs font-black border-b-4 transition-all whitespace-nowrap md:ml-auto bg-brand-purple/20
                        ${isAdminActive ? 'border-brand-accent text-brand-accent' : 'border-brand-purple text-purple-200 hover:text-white hover:bg-brand-purple/40'}">
                        <i class="fas fa-cogs"></i> CMS ADMIN
                    </button>
                `;
            }
            document.getElementById('tab-container').innerHTML = html;
        }

        window.renderApp = function() {
            window.renderTabs();
            const contentDiv = document.getElementById('app-content');
            
            contentDiv.classList.remove('animate-fade-in-up');
            void contentDiv.offsetWidth; 
            contentDiv.classList.add('animate-fade-in-up');

            if (window.activeTab === 'klasemen') contentDiv.innerHTML = window.renderKlasemen();
            else if (window.activeTab === 'h2h') contentDiv.innerHTML = window.renderH2H();
            else if (window.activeTab === 'winners') contentDiv.innerHTML = window.renderWinners();
            else if (window.activeTab === 'about') contentDiv.innerHTML = window.renderAbout();
            else if (window.activeTab === 'admin' && window.isAdminLoggedIn) contentDiv.innerHTML = window.renderAdminDashboard();
        }

    </script>
</body>
</html>
